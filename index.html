<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนผู้เช่า</title>
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <header>
        <!-- ใส่ URL ของโลโก้ของคุณ -->
        <img src="หอพัก.jpg" alt="Logo" class="logo">
    </header>

    <div class="container">
        <h1>ลงทะเบียนผู้เช่า</h1>

        <!-- แสดงข้อมูลโปรไฟล์ -->
        <div id="profile" style="display: none; text-align: center;">
            <img id="profileImage" src="" alt="Profile Image" style="border-radius: 50%; width: 100px; height: 100px;">
            <p id="displayName"></p>
        </div>

        <form id="tenantForm">
            <label for="room">ห้อง:</label>
            <select id="room" name="room" required>
                <option value="">เลือกห้อง</option>
                <option value="ห้อง2">ห้อง2</option>
                <option value="ห้อง3">ห้อง3</option>
                <option value="ห้อง4">ห้อง4</option>
                <option value="ห้อง6">ห้อง6</option>
                <option value="ห้อง8">ห้อง8</option>
                <option value="ห้อง2-1">ห้อง2-1</option>
                <option value="ห้อง2-2">ห้อง2-2</option>
                <option value="ห้อง2-3">ห้อง2-3</option>
                <option value="ห้อง2-4">ห้อง2-4</option>
                <option value="ห้อง2-5">ห้อง2-5</option>
                <option value="ห้อง3-1">ห้อง3-1</option>
                <option value="ห้อง3-2">ห้อง3-2</option>
                <option value="ห้อง3-3">ห้อง3-3</option>
                <option value="ห้อง3-4">ห้อง3-4</option>
                <option value="ห้อง3-5">ห้อง3-5</option>
            </select>

            <label for="name">ชื่อ:</label>
            <input type="text" id="name" name="name" required maxlength="60" autocomplete="name">

            <label for="phone">เบอร์โทร:</label>
            <input type="tel" id="phone" name="phone" required inputmode="tel" maxlength="10" pattern="0[0-9]{8,9}" title="กรอกเบอร์โทร 9-10 หลัก ขึ้นต้นด้วย 0 (ไม่ต้องมีขีด)" autocomplete="tel">

            <input type="hidden" id="userId" name="userId">
            <input type="hidden" id="profileImageUrl" name="profileImageUrl">

            <button type="submit">ลงทะเบียน</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API = 'https://script.google.com/macros/s/AKfycbzTqgebTJ95geAI-arcsc2iBbxYLjkbxq-Vq42BxflnCtNnIvc2b7mKjVrfPSOK5drH/exec';
        const LIFF_ID = '2008100543-3zvoPw2J'; // ต้องเป็น ID เท่านั้น ไม่ใช่ URL
        const $ = (id) => document.getElementById(id);

        function showError(title, text) {
            return Swal.fire({ title, text, icon: 'error', confirmButtonText: 'ตกลง' });
        }

        // ปิดห้องที่มีคนลงทะเบียนแล้วในรายการเลือกห้อง
        async function loadRegisteredRooms() {
            try {
                const res = await fetch(API + '?action=getRegisteredRooms');
                const registeredRooms = await res.json();
                Array.from($('room').options).forEach((option) => {
                    option.disabled = option.value !== '' && registeredRooms.includes(option.value);
                });
            } catch (error) {
                console.error('Error loading rooms:', error);
            }
        }

        async function initLiff() {
            Swal.fire({
                title: 'กำลังโหลด...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                await liff.init({ liffId: LIFF_ID });
            } catch (error) {
                console.error('LIFF init failed:', error);
                await showError('เปิดหน้านี้ไม่สำเร็จ', 'กรุณาเปิดผ่านลิงก์ใน LINE อีกครั้ง');
                return;
            }

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();
            $('userId').value = profile.userId;
            $('displayName').textContent = profile.displayName;
            if (profile.pictureUrl) {
                $('profileImage').src = profile.pictureUrl;
                $('profileImageUrl').value = profile.pictureUrl;
            }
            $('profile').style.display = 'block';

            // ถ้าลงทะเบียนแล้ว ไปหน้า info.html
            try {
                const res = await fetch(API + '?action=getTenantInfo&userId=' + encodeURIComponent(profile.userId));
                const data = await res.json();
                if (data.success) {
                    window.location.href = 'info.html';
                    return;
                }
            } catch (error) {
                console.error('Error checking tenant:', error);
            }

            await loadRegisteredRooms();
            Swal.close();
        }

        $('tenantForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const button = this.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'กำลังบันทึก...';

            try {
                const res = await fetch(API + '?action=registerTenant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(new FormData(this))
                });
                const data = await res.json();

                if (data.success) {
                    await Swal.fire({ title: 'สำเร็จ!', text: 'ลงทะเบียนสำเร็จ!', icon: 'success', confirmButtonText: 'ตกลง' });
                    window.location.href = 'info.html';
                    return;
                }
                await showError('ผิดพลาด!', 'ห้องนี้มีการลงทะเบียนแล้ว');
                await loadRegisteredRooms();
            } catch (error) {
                console.error('Error registering:', error);
                await showError('เชื่อมต่อไม่สำเร็จ', 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง');
            }

            button.disabled = false;
            button.textContent = 'ลงทะเบียน';
        });

        initLiff();
    </script>
</body>
</html>
