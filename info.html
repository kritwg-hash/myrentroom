<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลผู้เช่า</title>
    <script src="https://static.line-scdn.net/liff/edge/versions/2.25.1/sdk.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="info.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>
    <header>
        <h1>ข้อมูลผู้เช่า</h1>
    </header>

    <!-- Profile Section -->
    <div id="profile" style="display: none;">
        <h2>ห้อง: <span id="room"></span></h2>
        <img id="profileImage" src="" alt="Profile Image" style="border-radius: 50%; width: 100px; height: 100px;">
        <p id="displayName"></p>
        <p id="phone"></p>
    </div>

    <!-- Section to display invoice information -->
    <div id="invoiceInfo" style="display: none;">
        <h3>ข้อมูลใบแจ้งหนี้</h3>
        <div id="invoiceCardsContainer" class="invoice-cards-container"></div>
    </div>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        const API = 'https://script.google.com/macros/s/AKfycbzTqgebTJ95geAI-arcsc2iBbxYLjkbxq-Vq42BxflnCtNnIvc2b7mKjVrfPSOK5drH/exec';
        const LIFF_ID = '2008100543-3zvoPw2J';
        const $ = (id) => document.getElementById(id);

        // แสดงตัวเลขเป็นรูปแบบมีคอมมา ถ้าไม่ใช่ตัวเลขให้แสดงตามเดิม
        function formatValue(value) {
            if (value === null || value === undefined || value === '') return '-';
            const n = Number(value);
            return Number.isFinite(n) ? n.toLocaleString('th-TH') : String(value);
        }

        function addLine(card, label, value, className) {
            const p = document.createElement('p');
            p.append(label + ': ');
            const span = document.createElement('span');
            span.textContent = formatValue(value); // textContent กัน HTML แทรกจากข้อมูลในชีต
            if (className) span.className = className;
            p.append(span);
            card.append(p);
        }

        function showLoadError() {
            Swal.fire({
                title: 'โหลดข้อมูลไม่สำเร็จ',
                text: 'กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง',
                icon: 'error',
                confirmButtonText: 'ลองใหม่'
            }).then(() => window.location.reload());
        }

        async function initLiff() {
            Swal.fire({
                title: 'กำลังโหลด...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                await liff.init({ liffId: LIFF_ID });
            } catch (error) {
                console.error('LIFF init failed:', error);
                Swal.fire({ title: 'เปิดหน้านี้ไม่สำเร็จ', text: 'กรุณาเปิดผ่านลิงก์ใน LINE อีกครั้ง', icon: 'error', confirmButtonText: 'ตกลง' });
                return;
            }

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            const profile = await liff.getProfile();
            const userId = profile.userId;

            let data;
            try {
                const res = await fetch(API + '?action=getTenantInfo&userId=' + encodeURIComponent(userId));
                data = await res.json();
            } catch (error) {
                // เน็ตหลุด/เซิร์ฟเวอร์ไม่ตอบ: ไม่ส่งกลับไปหน้าลงทะเบียน เพราะผู้ใช้อาจลงทะเบียนไว้แล้ว
                console.error('Error:', error);
                Swal.close();
                showLoadError();
                return;
            }

            if (!data.success) {
                window.location.href = 'index.html'; // ยังไม่ได้ลงทะเบียน
                return;
            }

            if (data.profileImageUrl) $('profileImage').src = data.profileImageUrl;
            else $('profileImage').style.display = 'none';
            $('displayName').textContent = 'ชื่อ: ' + data.name;
            $('room').textContent = data.room;
            $('phone').textContent = 'เบอร์โทร: ' + data.phone;
            $('profile').style.display = 'block';
            Swal.close();

            fetchInvoiceData(userId);
        }

        async function fetchInvoiceData(userId) {
            const container = $('invoiceCardsContainer');
            try {
                const res = await fetch(API + '?action=getInvoiceData&userId=' + encodeURIComponent(userId));
                const invoiceData = await res.json();
                container.replaceChildren();

                if (!invoiceData.success || !Array.isArray(invoiceData.invoices) || invoiceData.invoices.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'empty';
                    empty.textContent = 'ยังไม่มีใบแจ้งหนี้';
                    container.append(empty);
                    $('invoiceInfo').style.display = 'block';
                    return;
                }

                // เรียงจากเดือนล่าสุดไปเก่าสุด (billingMonth รูปแบบ เดือน/ปี)
                invoiceData.invoices.sort((a, b) => {
                    const [monthA, yearA] = String(a.billingMonth).split('/').map(Number);
                    const [monthB, yearB] = String(b.billingMonth).split('/').map(Number);
                    return yearA !== yearB ? yearB - yearA : monthB - monthA;
                });

                invoiceData.invoices.forEach((invoice) => {
                    const card = document.createElement('div');
                    card.className = 'invoiceCard';

                    const title = document.createElement('h4');
                    title.textContent = 'ประจำเดือนที่: ' + invoice.billingMonth;
                    card.append(title);

                    addLine(card, 'ค่าเช่า', invoice.rent);
                    addLine(card, 'ค่าไฟ', invoice.electricityCost);
                    addLine(card, 'ค่าน้ำ', invoice.waterCost);
                    addLine(card, 'ค่าส่วนกลาง', invoice.commonAreaFee);
                    addLine(card, 'ค่าอินเทอร์เน็ต', invoice.internetFee);
                    addLine(card, 'อื่นๆ', invoice.otherCosts);
                    addLine(card, 'ยอดรวม', invoice.totalAmount, 'total');
                    const statusClass = invoice.status === 'รอการชำระ' ? 'status-pending' : invoice.status === 'ชำระแล้ว' ? 'status-paid' : '';
                    addLine(card, 'สถานะ', invoice.status, statusClass);

                    container.append(card);
                });
                $('invoiceInfo').style.display = 'block';
            } catch (error) {
                console.error('Error fetching invoice data:', error);
                showLoadError();
            }
        }

        initLiff();
    </script>
</body>
</html>
